<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 40" width="100%" height="40">
  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 25px;
      font-weight: 700;
      fill: #e6edf3;
      letter-spacing: -0.3px;
    }

    .accent-tag {
      fill: #00E5A3;
    }

    /* Periodic Micro-Glitch with Cyber Mint Phosphor Glow */
    .glitch-text {
      animation: microGlitch 5s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes microGlitch {
      0%, 88%, 94%, 100% {
        transform: translate(0, 0);
        filter: none;
      }
      89% {
        transform: translate(-1.8px, 0.9px);
        filter: drop-shadow(1.8px 0px 0px #00E5A3) drop-shadow(-1.8px 0px 0px #39d353);
      }
      91% {
        transform: translate(1.8px, -0.9px);
        filter: drop-shadow(-1.8px 0px 0px #00E5A3) drop-shadow(1.8px 0px 0px #7ee787);
      }
      93% {
        transform: translate(-1px, 0.5px);
        filter: drop-shadow(1.2px 0px 0px #00E5A3);
      }
    }
  </style>

  <!-- Cyber Mint Unified Header -->
  <g class="glitch-text">
    <text x="50%" y="28" text-anchor="middle" class="font-mono">
      hey, I'm Ayush <tspan class="accent-tag">[nondeader]</tspan> 👾
    </text>
  </g>
</svg>
