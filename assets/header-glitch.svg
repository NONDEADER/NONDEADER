<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 36" width="100%" height="36">
  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 19px;
      font-weight: 600;
      fill: #e6edf3;
      letter-spacing: -0.2px;
    }

    .accent-tag {
      fill: #58a6ff;
    }

    /* Periodic Micro-Glitch (Clean text for ~4.5s, instant glitch for ~0.3s) */
    .glitch-text {
      animation: microGlitch 5s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes microGlitch {
      0%, 88%, 94%, 100% {
        transform: translate(0, 0);
        filter: none;
      }
      89% {
        transform: translate(-1.5px, 0.8px);
        filter: drop-shadow(1.5px 0px 0px #bc8cff) drop-shadow(-1.5px 0px 0px #39d353);
      }
      91% {
        transform: translate(1.5px, -0.8px);
        filter: drop-shadow(-1.5px 0px 0px #58a6ff) drop-shadow(1.5px 0px 0px #ff7b72);
      }
      93% {
        transform: translate(-0.8px, 0.4px);
        filter: drop-shadow(1px 0px 0px #39d353);
      }
    }
  </style>

  <!-- Static, crisp centered text with periodic micro-glitch -->
  <g class="glitch-text">
    <text x="50%" y="25" text-anchor="middle" class="font-mono">
      hey, I'm Ayush <tspan class="accent-tag">[nondeader]</tspan> 👾
    </text>
  </g>
</svg>
